<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - PrepVance</title>

    <link rel="stylesheet" href="css/Style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

</head>

<body>

    <div class="background-circle circle-one"></div>

    <div class="background-circle circle-two"></div>

    <div class="dots dots-left">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>

    <div class="register-container">

        <h1 class="logo">
            Prep<span>Vance</span>
        </h1>

        <div class="subtitle">
            Interactive Placement Preparation Platform
        </div>

        <h2>
            Create Your Account
        </h2>

        <p class="welcome-text">
            Start your placement preparation journey with HireSprint.
        </p>

        <form id="registerForm">

            <label for="name">
                Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required>

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email address"
                required>

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                required>

            <button type="submit">
                Create Account →
            </button>

        </form>

        <p id="message"></p>

        <p class="login-link">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
