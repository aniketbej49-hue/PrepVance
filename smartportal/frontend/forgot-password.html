<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - PrepVance</title>

    <link rel="stylesheet"
          href="css/Style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="background-circle circle-one"></div>

    <div class="background-circle circle-two"></div>

    <div class="dots dots-left">

        <span></span>
        <span></span>
        <span></span>

        <span></span>
        <span></span>
        <span></span>

        <span></span>
        <span></span>
        <span></span>

    </div>

    <div class="login-container">

        <h1>
            Prep<span>Vance</span>
        </h1>

        <div class="subtitle">
            Interactive Placement Preparation Platform
        </div>

        <h2 id="forgotTitle">
            Forgot Password
        </h2>

        <div id="emailSection">

            <p class="section-description">
                Enter your registered email address
                to receive a verification OTP.
            </p>

            <form id="forgotPasswordForm">

                <label for="forgotEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="forgotEmail"
                    placeholder="Enter your registered email"
                    required
                >

                <button type="submit">
                    Send OTP →
                </button>

            </form>

        </div>

        <div id="otpSection"
             style="display: none;">

            <p class="section-description">
                Enter the 6-digit OTP sent to
                your registered email address.
            </p>

            <form id="verifyOtpForm">

                <label for="otp">
                    Verification OTP
                </label>

                <input
                    type="text"
                    id="otp"
                    maxlength="6"
                    inputmode="numeric"
                    placeholder="Enter 6-digit OTP"
                    required
                >

                <button type="submit">
                    Verify OTP →
                </button>

            </form>

        </div>

        <div id="passwordSection"
             style="display: none;">

            <p class="section-description">
                Create a new password for your
                HireSprint account.
            </p>

            <form id="resetPasswordForm">

                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    placeholder="Enter new password"
                    required
                >

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    required
                >

                <button type="submit">
                    Reset Password →
                </button>

            </form>

        </div>

        <p id="forgotMessage"></p>

        <p class="back-login">

            <a href="login.html">
                ← Back to Login
            </a>

        </p>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
