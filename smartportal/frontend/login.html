<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - PrepVance</title>

    <link rel="stylesheet" href="css/Style.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="background-circle circle-one"></div>

    <div class="background-circle circle-two"></div>

    <div class="dots dots-right">

        <span></span>
        <span></span>
        <span></span>

        <span></span>
        <span></span>
        <span></span>

        <span></span>
        <span></span>
        <span></span>

    </div>

    <div class="login-container">

        <h1 class="logo">
            Prep<span>Vance</span>
        </h1>

        <div class="subtitle">
            Interactive Placement Preparation Platform
        </div>

        <h2>
            Welcome Back
        </h2>

        <p class="welcome-text">
            Login to continue your placement preparation journey.
        </p>

        <form id="loginForm">

            <label for="loginEmail">
                Email
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email address"
                required>

            <label for="loginPassword">
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required>

            <button type="submit">
                Login →
            </button>

        </form>

        <p id="loginMessage"></p>

        <p class="forgot-link">

            <a href="forgot-password.html">
                Forgot Password?
            </a>

        </p>

        <p class="register-link">

            Don't have an account?

            <a href="register.html">
                Register
            </a>

        </p>

    </div>

    <script src="js/auth.js"></script>

</body>

</html>
