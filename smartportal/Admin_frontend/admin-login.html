<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Smart Interview Portal</title>

    <link rel="stylesheet"
          href="css/admin.css">

</head>


<body class="admin-auth-page">


    
    <div class="admin-auth-container">


        <div class="admin-auth-card">


    

            <div class="admin-auth-header">

                <p class="admin-label">
                   PrepVance
                </p>

                <h1>
                    Admin Login
                </h1>

                <p>
                    Login to manage interview
                    preparation content.
                </p>

            </div>



           

            <form id="adminLoginForm">


                

                <div class="form-group">

                    <label for="adminLoginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="adminLoginEmail"
                        placeholder="Enter admin email"
                        required
                    >

                </div>



            

                <div class="form-group">

                    <label for="adminLoginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminLoginPassword"
                        placeholder="Enter password"
                        required
                    >

                </div>



            

                <button
                    type="submit"
                    class="admin-auth-button">

                    Login as Admin

                </button>


            </form>





            <p
                id="adminLoginMessage"
                class="admin-auth-message">
            </p>



        

            <div class="admin-auth-footer">

                <p>
                    Don't have an admin account?
                </p>

                <a href="admin-register.html">
                    Create Admin Account
                </a>

            </div>


        </div>


    </div>




    <script src="js/admin-auth.js"></script>


</body>

</html>
