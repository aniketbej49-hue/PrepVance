<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Registration - PrepVance</title>

    <link rel="stylesheet"
          href="css/admin.css">

</head>


<body class="admin-auth-page">


    

    <div class="admin-auth-container">


        <div class="admin-auth-card">


            
            <div class="admin-auth-header">

                <p class="admin-label">
                    PrepVance
                </p>

                <h1>
                    Admin Registration
                </h1>

                <p>
                    Create an administrator account
                    to manage portal content.
                </p>

            </div>



            

            <form id="adminRegisterForm">


                

                <div class="form-group">

                    <label for="adminName">
                        Name
                    </label>

                    <input
                        type="text"
                        id="adminName"
                        placeholder="Enter admin name"
                        required
                    >

                </div>



              

                <div class="form-group">

                    <label for="adminEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                        required
                    >

                </div>



               

                <div class="form-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="adminPassword"
                        placeholder="Enter password"
                        required
                    >

                </div>



                

                <div class="form-group">

                    <label for="adminConfirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="adminConfirmPassword"
                        placeholder="Confirm password"
                        required
                    >

                </div>



                

                <button
                    type="submit"
                    class="admin-auth-button">

                    Create Admin Account

                </button>


            </form>



            
            <p>
                id="adminRegisterMessage"
                class="admin-auth-message">
            </p>



        
            <div class="admin-auth-footer">

                <p>
                    Already have an admin account?
                </p>

                <a href="admin-login.html">
                    Admin Login
                </a>

            </div>


        </div>


    </div>




    <script src="js/admin-auth.js"></script>


</body>

</html>
