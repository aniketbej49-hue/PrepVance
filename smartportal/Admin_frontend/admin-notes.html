<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PrepVance - Admin Notes</title>

    <link rel="stylesheet" href="css/admin-notes.css">

</head>


<body>


    <header class="admin-header">

        <h2>PrepVance</h2>

        <div class="admin-info">

            <span id="adminEmail"></span>

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </header>




    <main class="container">

        <h1>Notes Management</h1>

        <p class="subtitle">
            Upload and manage topic-wise PDF notes
        </p>



        <section class="note-form">

            <h2 id="formTitle">
                Add PDF Note
            </h2>


            <form id="noteForm">


         

                <label for="topicId">
                    Select Topic
                </label>

                <select id="topicId" required>

                    <option value="">
                        Select Topic
                    </option>

                </select>


             

                <label for="title">
                    Note Title
                </label>

                <input
                    type="text"
                    id="title"
                    placeholder="Example: Java OOP Notes"
                    required
                >


            

                <label for="pdfFile">
                    Select PDF
                </label>

                <input
                    type="file"
                    id="pdfFile"
                    accept=".pdf,application/pdf"
                    required
                >

                <p class="file-info">
                    Only PDF files are allowed.
                </p>


            

                <button
                    type="submit"
                    id="submitBtn"
                    class="add-btn">

                    Upload PDF

                </button>


                <button
                    type="button"
                    id="cancelBtn"
                    class="cancel-btn"
                    onclick="resetForm()"
                    style="display: none;">

                    Cancel

                </button>

            </form>

        </section>



        <section class="search-section">

            <input
                type="text"
                id="searchInput"
                placeholder="Search notes..."
            >

            <button onclick="searchNotes()">
                Search
            </button>

            <button onclick="loadNotes()">
                View All
            </button>

        </section>



        <section class="table-section">

            <h2>
                Uploaded Notes
            </h2>


            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Topic</th>

                        <th>Title</th>

                        <th>PDF</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="notesTableBody">

            

                </tbody>

            </table>

        </section>

    </main>


    <script src="js/admin-notes.js"></script>

</body>

</html>
